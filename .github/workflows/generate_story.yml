name: Generate Sleep Story

on:
  schedule:
    - cron: '0 23 * * *' # Runs at 23:00 UTC (2:00 AM EAT) every day
  workflow_dispatch: # Allows you to run it manually from the Actions tab


jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the file move back to GitHub
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng

      - name: Install PyTorch CPU
        run: pip install --no-cache-dir torch torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install Python Dependencies
        run: pip install --no-cache-dir -r requirements.txt


      - name: Process Movies
        env:
          COMMANDCODE_API_KEY: ${{ secrets.COMMANDCODE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_OAUTH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_TOKEN }}
        run: python -u process_movies.py

      - name: Commit Queue Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          mkdir -p completed_stories
          git add -A ready_stories/ completed_stories/
          git commit -m "Updated story queue [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push


