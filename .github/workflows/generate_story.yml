name: Generate Sleep Story

on:
  schedule:
    - cron: '0 23 * * *' # Runs at 23:00 UTC (7:00 PM EST) every day
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the file move back to GitHub
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Process Movies
        env:
          COMMANDCODE_API_KEY: ${{ secrets.COMMANDCODE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_OAUTH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_TOKEN }}
        run: python -u process_movies.py

      - name: Commit Queue Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ready_stories/ completed_stories/ pending_scripts/ completed_scripts/
          git commit -m "Updated story queue" || echo "No changes to commit"
          git push

      - name: Upload Audio Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sleep-story-audio
          path: '*_audio.wav'
          retention-days: 7
