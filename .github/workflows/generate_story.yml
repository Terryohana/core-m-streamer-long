name: Generate Sleep Story

on:
  push:
    paths:
      - '*.srt' # Trigger when a new movie subtitle is uploaded

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Process Movies
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_OAUTH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_TOKEN }}
        run: python process_movies.py

      - name: Upload Audio Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sleep-story-audio
          path: '*_audio.wav'
          retention-days: 7
